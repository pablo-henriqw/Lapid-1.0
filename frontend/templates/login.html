<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar · Lapid.ai</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="auth">
  <form class="auth-card" method="post" autocomplete="on">
    <a class="brand" href="#"><span class="brand-dot"></span>lapid<span class="brand-ai">.ai</span></a>
    <h1>Entrar no painel</h1>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="flash flash-{{ cat }}" role="alert">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% if not configured %}
      <div class="flash flash-error">Defina <code>ADMIN_EMAIL</code> e <code>ADMIN_PASSWORD_HASH</code> no arquivo <code>.env</code> para habilitar o acesso.</div>
    {% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required autocomplete="username" autofocus>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn-primary" type="submit">Entrar</button>
  </form>
</body>
</html>
