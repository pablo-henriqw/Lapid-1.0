<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site de demonstração</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:640px;margin:15vh auto;padding:0 20px;line-height:1.6;color:#1b2230}
    code{background:#eef1f6;padding:2px 6px;border-radius:4px}
  </style>
</head>
<body>
  <h1>Site de demonstração</h1>
  <p>Esta página simula um site de cliente. Use o botão de suporte no canto inferior direito para enviar um relato.</p>
  {% if site %}
    <script src="{{ url_for('public.widget') }}" data-key="{{ site.api_key }}" defer></script>
  {% else %}
    <p><strong>Nenhum site conectado.</strong> Crie um em <a href="{{ url_for('admin.sites') }}">Sites</a> com o domínio <code>{{ request.host.split(':')[0] }}</code> e recarregue.</p>
  {% endif %}
</body>
</html>
